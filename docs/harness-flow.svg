<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 380" width="980" height="380" role="img" aria-label="Harness data flow: you give the main session a task, the planner writes plan files, the runner drives the pi executor inside a worktree and checks it, reports flow back to the main session, and only you land the worktree into your main tree.">
  <style>
    svg{--bg:#f5f6f4;--panel:#ffffff;--ink:#1c2321;--muted:#5d6864;--line:#dde2df;--code-bg:#eef1ef;--accent:#1f6f5c;--free:#1f7a45;--free-bg:#e3f2e8;font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
    @media (prefers-color-scheme: dark){svg{--bg:#131816;--panel:#1b2220;--ink:#e4e9e6;--muted:#9aa6a1;--line:#2c3531;--code-bg:#232c29;--accent:#5cc0a3;--free:#7fd4a0;--free-bg:#1d3226}}
    .bg{fill:var(--bg)}
    .box rect{fill:var(--panel);stroke:var(--line);stroke-width:1.5}
    .box text{fill:var(--ink);font-size:14px;font-weight:600;text-anchor:middle}
    .box text.sub{fill:var(--muted);font-size:11.5px;font-weight:400;font-family:"IBM Plex Mono",ui-monospace,Consolas,monospace}
    .box.you rect{fill:var(--code-bg)}
    .box.swap rect{stroke:var(--accent);stroke-width:2.5}
    .box.free rect{fill:var(--free-bg);stroke:var(--free)}
    .ar line,.ar path{stroke:var(--muted);stroke-width:1.4;fill:none}
    .ar .land{stroke-dasharray:5 4}
    .head{fill:var(--muted)}
    .lbl text{fill:var(--muted);font-size:12px;text-anchor:middle;font-family:"IBM Plex Mono",ui-monospace,Consolas,monospace}
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0 0L10 5L0 10z"/></marker>
  </defs>
  <rect class="bg" width="980" height="380" rx="10"/>
  <!-- row A -->
  <g class="box you"><rect x="20" y="40" width="130" height="64" rx="8"/><text x="85" y="67">You</text><text class="sub" x="85" y="86">decide · approve</text></g>
  <g class="box swap"><rect x="250" y="40" width="190" height="64" rx="8"/><text x="345" y="67">Main session</text><text class="sub" x="345" y="86">Claude · pi · opencode</text></g>
  <g class="box"><rect x="520" y="40" width="190" height="64" rx="8"/><text x="615" y="67">Planner</text><text class="sub" x="615" y="86">@planner or --plan</text></g>
  <g class="box"><rect x="790" y="40" width="170" height="64" rx="8"/><text x="875" y="67">Plan</text><text class="sub" x="875" y="86">plan.md · tasks.json</text></g>
  <!-- row B -->
  <g class="box you"><rect x="20" y="250" width="130" height="64" rx="8"/><text x="85" y="277">Main tree</text><text class="sub" x="85" y="296">your repo</text></g>
  <g class="box"><rect x="250" y="250" width="190" height="64" rx="8"/><text x="345" y="277">Worktree</text><text class="sub" x="345" y="296">.worktrees/&lt;slug&gt;</text></g>
  <g class="box free"><rect x="520" y="250" width="190" height="64" rx="8"/><text x="615" y="277">Executor</text><text class="sub" x="615" y="296">pi · Bunny</text></g>
  <g class="box"><rect x="790" y="250" width="170" height="64" rx="8"/><text x="875" y="277">Runner</text><text class="sub" x="875" y="296">guards · retries</text></g>
  <!-- arrows -->
  <g class="ar">
    <line x1="150" y1="62" x2="248" y2="62" marker-end="url(#ah)"/>
    <line x1="250" y1="86" x2="152" y2="86" marker-end="url(#ah)"/>
    <line x1="440" y1="72" x2="518" y2="72" marker-end="url(#ah)"/>
    <line x1="710" y1="72" x2="788" y2="72" marker-end="url(#ah)"/>
    <line x1="875" y1="104" x2="875" y2="248" marker-end="url(#ah)"/>
    <line x1="790" y1="282" x2="712" y2="282" marker-end="url(#ah)"/>
    <line x1="520" y1="282" x2="442" y2="282" marker-end="url(#ah)"/>
    <path d="M875 314V350H345V316" fill="none" marker-end="url(#ah)"/>
    <line x1="345" y1="250" x2="345" y2="106" marker-end="url(#ah)"/>
    <line class="land" x1="250" y1="282" x2="152" y2="282" marker-end="url(#ah)"/>
  </g>
  <g class="lbl">
    <text x="199" y="55">task · go</text>
    <text x="199" y="101">report</text>
    <text x="479" y="64">spec</text>
    <text x="749" y="64">writes</text>
    <text x="867" y="180" text-anchor="end">run_plan.py &lt;slug&gt;</text>
    <text x="751" y="274">brief T&lt;n&gt;</text>
    <text x="481" y="274">edits files</text>
    <text x="610" y="368">runs acceptance check, then retry or repair</text>
    <text x="353" y="180" text-anchor="start">SUMMARY · reports · diff</text>
    <text x="199" y="274">--land</text>
    <text x="199" y="302">you only</text>
  </g>
</svg>
