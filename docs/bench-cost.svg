<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 290" width="960" height="290" role="img" aria-label="Staged shop benchmark, 59 hidden checks: pure Sonnet cost $3.39 in 13.6 minutes; harness with opencode cost $1.18 in 22.1 minutes; harness with pi cost $1.47 in 26.4 minutes.">
  <style>
    svg{--bg:#f5f6f4;--ink:#1c2321;--muted:#5d6864;--line:#dde2df;--paid:#b3761a;--paid-bg:#fbefd9;--free:#1f7a45;--free-bg:#e3f2e8;font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
    @media (prefers-color-scheme: dark){svg{--bg:#131816;--ink:#e4e9e6;--muted:#9aa6a1;--line:#2c3531;--paid:#f0b75c;--paid-bg:#3a2d15;--free:#7fd4a0;--free-bg:#1d3226}}
    .bg{fill:var(--bg)}
    .h{fill:var(--ink);font-size:16px;font-weight:600}
    .sub{fill:var(--muted);font-size:12.5px}
    .lbl{fill:var(--ink);font-size:14px;font-weight:600;text-anchor:end}
    .meta{fill:var(--muted);font-size:12px;text-anchor:end;font-family:"IBM Plex Mono",ui-monospace,Consolas,monospace}
    .val{fill:var(--ink);font-size:14px;font-weight:600;font-family:"IBM Plex Mono",ui-monospace,Consolas,monospace}
    .tick{fill:var(--muted);font-size:11px;text-anchor:middle;font-family:"IBM Plex Mono",ui-monospace,Consolas,monospace}
    .gl{stroke:var(--line);stroke-width:1}
    .paid{fill:var(--paid-bg);stroke:var(--paid);stroke-width:1.5}
    .free{fill:var(--free-bg);stroke:var(--free);stroke-width:1.5}
  </style>
  <rect class="bg" width="960" height="290" rx="14"/>
  <text class="h" x="32" y="40">What a 6-stage feature cost</text>
  <text class="sub" x="32" y="60">Staged shop bench, 59 hidden checks, one rep each (2026-09-25). Claude cost in USD.</text>

  <!-- scale: $1 = 177px from x=260 -->
  <g class="gl">
    <line x1="260" y1="80" x2="260" y2="250"/><line x1="437" y1="80" x2="437" y2="250"/>
    <line x1="614" y1="80" x2="614" y2="250"/><line x1="791" y1="80" x2="791" y2="250"/>
  </g>
  <text class="tick" x="260" y="270">$0</text><text class="tick" x="437" y="270">$1</text>
  <text class="tick" x="614" y="270">$2</text><text class="tick" x="791" y="270">$3</text>

  <text class="lbl" x="244" y="107">Pure Sonnet</text><text class="meta" x="244" y="124">59/59 · 13.6 min</text>
  <rect class="paid" x="260" y="92" width="600" height="34" rx="5"/>
  <text class="val" x="870" y="114">$3.39</text>

  <text class="lbl" x="244" y="163">Harness + opencode</text><text class="meta" x="244" y="180">59/59 · 22.1 min</text>
  <rect class="free" x="260" y="148" width="209" height="34" rx="5"/>
  <text class="val" x="479" y="170">$1.18</text>

  <text class="lbl" x="244" y="219">Harness + pi</text><text class="meta" x="244" y="236">58/59 · 26.4 min</text>
  <rect class="free" x="260" y="204" width="260" height="34" rx="5"/>
  <text class="val" x="530" y="226">$1.47</text>
</svg>
