<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470" role="img" aria-label="Claude Code setup: Claude decides, the @planner sonnet subagent writes the plan, execution runs either with the pi or opencode executor or all-Claude via the @claude-executor haiku subagent, the runner grades every task, and you land it.">
  <style>
    svg{--bg:#f5f6f4;--panel:#ffffff;--ink:#1c2321;--muted:#5d6864;--line:#dde2df;--code-bg:#eef1ef;--accent:#1f6f5c;--free:#1f7a45;--free-bg:#e3f2e8;font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
    @media (prefers-color-scheme: dark){svg{--bg:#131816;--panel:#1b2220;--ink:#e4e9e6;--muted:#9aa6a1;--line:#2c3531;--code-bg:#232c29;--accent:#5cc0a3;--free:#7fd4a0;--free-bg:#1d3226}}
    .bg{fill:var(--bg)}
    .title{fill:var(--ink);font-size:28px;font-weight:700;letter-spacing:-0.5px}
    .title tspan{fill:var(--accent)}
    .tag{fill:var(--muted);font-size:14px}
    .box rect{fill:var(--panel);stroke:var(--line);stroke-width:1.5}
    .box text{fill:var(--ink);font-size:14px;font-weight:600;text-anchor:middle}
    .box text.sub{fill:var(--muted);font-size:11.5px;font-weight:400;font-family:"IBM Plex Mono",ui-monospace,Consolas,monospace}
    .box.you rect{fill:var(--code-bg)}
    .box.swap rect{stroke:var(--accent);stroke-width:2.5}
    .box.free rect{fill:var(--free-bg);stroke:var(--free)}
    .ar line,.ar path{stroke:var(--muted);stroke-width:1.4;fill:none}
    .ar .land{stroke-dasharray:5 4}
    .head{fill:var(--muted)}
    .lbl text{fill:var(--muted);font-size:12px;text-anchor:middle;font-family:"IBM Plex Mono",ui-monospace,Consolas,monospace}
    .note{fill:var(--muted);font-size:12.5px}
    .note .mono{font-family:"IBM Plex Mono",ui-monospace,Consolas,monospace}
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0 0L10 5L0 10z"/></marker>
  </defs>
  <rect class="bg" width="980" height="470" rx="10"/>
  <text class="title" x="20" y="30">Setup <tspan>· Claude Code</tspan></text>
  <text class="tag" x="20" y="50">Claude Code is the main session and the planner; execution can stay in Claude with @claude-executor.</text>

  <!-- row A -->
  <g class="box you"><rect x="20" y="72" width="130" height="64" rx="8"/><text x="85" y="99">You</text><text class="sub" x="85" y="118">decide · approve</text></g>
  <g class="box swap"><rect x="250" y="72" width="190" height="64" rx="8"/><text x="345" y="99">Claude Code</text><text class="sub" x="345" y="118">CLAUDE.md · HARNESS.md</text></g>
  <g class="box"><rect x="520" y="72" width="190" height="64" rx="8"/><text x="615" y="99">@planner</text><text class="sub" x="615" y="118">sonnet subagent</text></g>
  <g class="box"><rect x="790" y="72" width="170" height="64" rx="8"/><text x="875" y="99">Plan</text><text class="sub" x="875" y="118">plan.md · tasks.json</text></g>
  <!-- row B -->
  <g class="box you"><rect x="20" y="250" width="130" height="64" rx="8"/><text x="85" y="277">Main tree</text><text class="sub" x="85" y="296">your repo</text></g>
  <g class="box"><rect x="250" y="250" width="190" height="64" rx="8"/><text x="345" y="277">Worktree</text><text class="sub" x="345" y="296">.worktrees/&lt;slug&gt;</text></g>
  <g class="box free"><rect x="520" y="250" width="190" height="64" rx="8"/><text x="615" y="277">@claude-executor</text><text class="sub" x="615" y="296">haiku subagent · or pi/opencode</text></g>
  <g class="box"><rect x="790" y="250" width="170" height="64" rx="8"/><text x="875" y="277">Runner</text><text class="sub" x="875" y="296">run_plan.py</text></g>
  <!-- arrows -->
  <g class="ar">
    <line x1="150" y1="94" x2="248" y2="94" marker-end="url(#ah)"/>
    <line x1="250" y1="118" x2="152" y2="118" marker-end="url(#ah)"/>
    <line x1="440" y1="104" x2="518" y2="104" marker-end="url(#ah)"/>
    <line x1="710" y1="104" x2="788" y2="104" marker-end="url(#ah)"/>
    <line x1="875" y1="136" x2="875" y2="248" marker-end="url(#ah)"/>
    <line x1="790" y1="282" x2="712" y2="282" marker-end="url(#ah)"/>
    <line x1="520" y1="282" x2="442" y2="282" marker-end="url(#ah)"/>
    <path d="M875 314V340H345V316" fill="none" marker-end="url(#ah)"/>
    <line x1="345" y1="250" x2="345" y2="138" marker-end="url(#ah)"/>
    <line class="land" x1="250" y1="282" x2="152" y2="282" marker-end="url(#ah)"/>
  </g>
  <g class="lbl">
    <text x="199" y="87">task · go</text>
    <text x="199" y="133">report</text>
    <text x="479" y="96">@planner</text>
    <text x="749" y="96">writes</text>
    <text x="867" y="195" text-anchor="end">run_plan.py &lt;slug&gt;</text>
    <text x="751" y="274">brief T&lt;n&gt;</text>
    <text x="481" y="274">edits files</text>
    <text x="610" y="360">runs acceptance, then retry or repair</text>
    <text x="353" y="195" text-anchor="start">SUMMARY · reports · diff</text>
    <text x="199" y="274">--land</text>
    <text x="199" y="298">you only</text>
  </g>

  <g class="note">
    <text x="20" y="380">• main session: Claude Code (<tspan class="mono">CLAUDE.md</tspan> → <tspan class="mono">.harness/HARNESS.md</tspan> loop)</text>
    <text x="20" y="402">• plan: <tspan class="mono">@planner</tspan> sonnet subagent lints its own plan; <tspan class="mono">--plan SPEC.md</tspan> fallback</text>
    <text x="20" y="424">• run: <tspan class="mono">run_plan.py &lt;slug&gt;</tspan> → pi/opencode executor in a worktree</text>
    <text x="20" y="446">• all-Claude: <tspan class="mono">--executor agent:haiku</tspan>, spawn <tspan class="mono">@claude-executor</tspan>; the rerun grades and lands</text>
  </g>
</svg>
